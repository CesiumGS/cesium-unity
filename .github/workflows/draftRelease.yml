name: Draft Release
on:
  push:
    branches: [draft-release-workflow]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.26.0"
        required: true
        type: string
      source_branch:
        description: "Branch whose build artifacts should be published"
        required: false
        default: "main"
        type: string
      run_id:
        description: "Build run ID to publish. Defaults to the latest successful build of the source branch."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Preview the package and release notes without downloading the package or changing releases"
        required: false
        default: false
        type: boolean

jobs:
  DraftRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected X.Y.Z, for example 1.26.0."
            exit 1
          fi

      - name: Resolve the build to publish
        run: |
          if [[ -n "$RUN_ID_INPUT" ]]; then
            run_id="$RUN_ID_INPUT"
            conclusion=$(gh run view "$run_id" --json conclusion --jq .conclusion)
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Build run $run_id concluded with '$conclusion'. Only successful builds can be published."
              exit 1
            fi
          else
            run_id=$(gh run list --workflow build.yml --branch "$SOURCE_BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::error::No successful build.yml run found for branch '$SOURCE_BRANCH'. Wait for CI to pass, or pass an explicit run_id."
            exit 1
          fi

          head_sha=$(gh run view "$run_id" --json headSha --jq .headSha)
          echo "Selected package from run $run_id (commit $head_sha, requested branch $SOURCE_BRANCH)."
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Inspect artifacts and print the package plan
        run: |
          artifacts=$(gh api --paginate --slurp "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts")
          echo "--- artifacts found in run $RUN_ID ---"
          jq -r '.[] | .artifacts[] | "\(.name): id=\(.id), size=\(.size_in_bytes) bytes, expired=\(.expired)"' <<< "$artifacts"

          matches=$(jq '[.[] | .artifacts[] | select(.name == "Combined Package" and .expired == false)] | length' <<< "$artifacts")
          if [[ "$matches" -ne 1 ]]; then
            echo "::error::Expected one available artifact named 'Combined Package', found $matches."
            exit 1
          fi

          name=$(jq -r ".name" package.json)
          echo "--- package plan: artifact -> release asset ---"
          echo "Combined Package -> ${name}-${VERSION}.tgz"

      - name: Download and verify the release package
        run: |
          mkdir -p out
          gh run download "$RUN_ID" --name "Combined Package" --dir out

          expected="$(jq -r ".name" package.json)-${VERSION}.tgz"
          actual=$(find out -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')
          if [[ "$actual" -ne 1 ]]; then
            echo "::error::Expected exactly one .tgz file in the Combined Package artifact, found $actual."
            exit 1
          fi

          found=$(basename "$(find out -maxdepth 1 -name '*.tgz')")
          if [[ "$found" != "$expected" ]]; then
            echo "::error::Expected package '$expected' but the build produced '$found'. Does package.json's version match the requested release version?"
            exit 1
          fi

          echo "--- SHA256 of the package to be uploaded ---"
          sha256sum "out/$found"

      - name: Generate the release notes
        run: |
          if ! changelog=$(node scripts/changelog.js --version "$VERSION" 2> changelog-error.txt); then
            reason=$(cat changelog-error.txt)
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::Could not extract the changelog for v${VERSION}: ${reason}"
              changelog="_Dry run: no changelog section for v${VERSION} was found in CHANGES.md._"
            else
              echo "::error::Could not extract the changelog for v${VERSION}: ${reason}"
              exit 1
            fi
          fi

          CHANGELOG="$changelog" python3 - > notes.md <<'PYTHON'
          import os

          with open("scripts/release-notes-template.md", encoding="utf-8") as file:
              notes = file.read()

          notes = notes.replace("{{CHANGELOG}}", os.environ["CHANGELOG"].strip())

          print(notes.strip())
          PYTHON

          echo "--- release notes ---"
          cat notes.md

      - name: Create or update the draft release (preview only in dry run)
        run: |
          tag="v${VERSION}"
          title="Cesium for Unity v${VERSION}"
          echo "Release title: $title"
          echo "Release tag: $tag"
          echo "Target commit: $HEAD_SHA"

          if gh release view "$tag" > /dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]]; then
              if [[ "$DRY_RUN" != "true" ]]; then
                echo "::error::Release $tag already exists and has been published. Refusing to modify it."
                exit 1
              fi
              echo "::warning::Release $tag already exists and has been published. A full run would stop here and refuse to modify it."
            else
              echo "Would update the existing draft $tag with the release notes printed above."
              if [[ "$DRY_RUN" != "true" ]]; then
                gh release edit "$tag" --title "$title" --notes-file notes.md --target "$HEAD_SHA"
              fi
            fi
          else
            echo "Would create draft $tag with the release notes printed above."
            if [[ "$DRY_RUN" != "true" ]]; then
              gh release create "$tag" --draft --title "$title" --notes-file notes.md --target "$HEAD_SHA"
            fi
          fi

          echo "Would upload the planned package, replacing an attachment with a matching name."
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: no package downloaded and no release changes made."
          else
            gh release upload "$tag" out/*.tgz --clobber
          fi

      - name: Summarize
        run: |
          {
            echo "### Draft release v${VERSION}"
            echo
            echo "Selected build: [${RUN_ID}](https://github.com/${GH_REPO}/actions/runs/${RUN_ID}) at commit \`${HEAD_SHA}\`."
            echo
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "**Dry run:** no package downloaded and no release changes made. See the logs for artifact metadata, the package plan, and release notes."
            else
              echo "Review the draft at https://github.com/${GH_REPO}/releases before publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
